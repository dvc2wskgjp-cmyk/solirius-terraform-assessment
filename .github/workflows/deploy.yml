
name: Build and Deploy .NET API

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/deploy.yml"
      - "**/*.tf"
      - ".terraform.lock.hcl"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-validation:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"

      - name: Initialise Terraform without Azure backend
        run: terraform init -backend=false -input=false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform configuration
        run: terraform validate

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore API dependencies
        run: dotnet restore src/SampleApi/SampleApi.csproj

      - name: Build application
        run: dotnet build src/SampleApi/SampleApi.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test tests/SampleApi.Tests/SampleApi.Tests.csproj --configuration Release

      - name: Publish application
        run: dotnet publish src/SampleApi/SampleApi.csproj --configuration Release --no-build --output ./publish

      - name: Log in to Azure
        if: github.event_name == 'workflow_dispatch'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        if: github.event_name == 'workflow_dispatch'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
